        - tag: class
          value: '{#CLASS}'
        - tag: model
          value: '{#MODEL}'
      - uuid: cbba6065e57848149f8b657a18e22842
        name: '{#CLASS} {#MODEL}: power max'
        type: CALCULATED
        key: intersight.model.power.max[{#CLASS},{#MODEL}]
        delay: 5m
        value_type: FLOAT
