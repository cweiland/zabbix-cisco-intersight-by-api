    tags:
    - tag: class
      value: hardware
    - tag: target
      value: cisco-intersight
    macros:
    - macro: '{$INTERSIGHT.API.HOST}'
      value: intersight.com
      description: Intersight FQDN (SaaS region or appliance).
    - macro: '{$INTERSIGHT.AUTH}'
      value: hs2019
      description: hs2019 = API key v3 (EC P-256, ECDSA in pure JS). rsa = API key v2. oauth = OAuth2 client credentials.
    - macro: '{$INTERSIGHT.CLIENT_ID}'
      value: ''
      description: OAuth2 client ID (app registration with client_credentials grant).
    - macro: '{$INTERSIGHT.CLIENT_SECRET}'
      description: OAuth2 client secret.
      type: SECRET_TEXT
    - macro: '{$INTERSIGHT.KEY_ID}'
      value: ''
      description: API key ID (hs2019 or rsa).
    - macro: '{$INTERSIGHT.SECRET}'
      description: 'Private key (EC for hs2019, RSA for rsa): full PEM with literal \n, or base64 body on one line.'
      type: SECRET_TEXT
    - macro: '{$INTERSIGHT.WINDOW}'
      value: '15'
      description: Telemetry window in minutes.
    - macro: '{$INTERSIGHT.DATASOURCE}'
      value: PhysicalEntities
      description: Druid dataSource of hw.host, hw.temperature, hw.fan, hw.power_supply (Cisco doc).
    - macro: '{$INTERSIGHT.DATASOURCE.NETWORK}'
      value: NetworkInterfaces
      description: Druid dataSource of hw.network (Cisco doc).
    - macro: '{$INTERSIGHT.COMPONENT.DIM}'
      value: name
      description: 'Druid attribute naming a PSU / sensor / port (Cisco doc: name).'
    - macro: '{$INTERSIGHT.FLAT.SERVERS}'
      value: '1'
      description: 1 = all servers discovered here. 0 = blades discovered under their chassis (Zabbix 7.4 nested).
    - macro: '{$ZABBIX.API.URL}'
      value: https://zabbix.example.com/api_jsonrpc.php
      description: Zabbix API URL used by history.push.
    - macro: '{$ZABBIX.API.TOKEN}'
      description: API token of a dedicated user with read access to Intersight/* groups.
      type: SECRET_TEXT
    - macro: '{$INTERSIGHT.ENERGY.PRICE}'
      value: '0'
      description: Electricity price per kWh. To fill in.
    - macro: '{$INTERSIGHT.CO2.G.KWH}'
      value: '0'
      description: Grid carbon intensity in gCO2/kWh. To fill in.
