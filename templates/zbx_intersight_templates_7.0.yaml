        - tag: class
          value: '{#CLASS}'
        - tag: model
          value: '{#MODEL}'
      - uuid: 6243a4c3871d450cb033b92ef9d28dc7
        name: '{#CLASS} {#MODEL}: energy last 24h'
        type: CALCULATED
        key: intersight.model.energy[{#CLASS},{#MODEL}]
        delay: 1h
        value_type: FLOAT
        params: sum(last_foreach(/*/intersight.energy.kwh.24h?[group="{#GROUP}"]))
        units: kWh
        tags:
        - tag: component
          value: aggregate
        - tag: class
