        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      item_prototypes:
      - uuid: 4a654a9694024f43a72e3ef8622882d6
        name: '{#CLASS} {#MODEL}: power sum'
        type: CALCULATED
        key: intersight.model.power.sum[{#CLASS},{#MODEL}]
        delay: 5m
        value_type: FLOAT
        params: sum(last_foreach(/*/intersight.power?[group="{#GROUP}"]))
        units: W
        tags:
        - tag: component
          value: aggregate
        - tag: class
          value: '{#CLASS}'
        - tag: model
          value: '{#MODEL}'
      - uuid: a4ff36c66ecf42e9a5142ed7aef29fe4
