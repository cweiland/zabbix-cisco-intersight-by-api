    discovery_rules:
    - uuid: 773e309eb53e4ca18a053328908f0acd
      name: PSU discovery
      type: DEPENDENT
      key: intersight.psu.discovery
      master_item:
        key: intersight.raw
      lifetime: 7d
      lld_macro_paths:
      - lld_macro: '{#PSU}'
        path: $.name
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.psus
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      item_prototypes:
      - uuid: 77934d36322e4252bab75c6ca2f3d716
        name: 'PSU {#PSU}: utilization'
        type: DEPENDENT
        key: intersight.psu.util[{#PSU}]
        value_type: FLOAT
        master_item:
          key: intersight.raw
        units: '%'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.psus[?(@.name=='{#PSU}')].util.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: psu
        - tag: psu
          value: '{#PSU}'
      - uuid: 6764b038c362443db3d5d0e490999943
        name: 'PSU {#PSU}: output power'
        type: DEPENDENT
        key: intersight.psu.out[{#PSU}]
        value_type: FLOAT
        master_item:
          key: intersight.raw
        units: W
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.psus[?(@.name=='{#PSU}')].out_w.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: psu
        - tag: psu
          value: '{#PSU}'
      trigger_prototypes:
      - uuid: b1954d98043d4c10841971f2098ab43e
        expression: min(/Cisco Intersight FI by push/intersight.psu.util[{#PSU}],15m)>{$INTERSIGHT.PSU.UTIL.WARN}
        name: 'Intersight: PSU {#PSU} above {$INTERSIGHT.PSU.UTIL.WARN}% for 15m'
        priority: WARNING
        description: 'Little headroom left: losing the other PSU could overload this one.'
    - uuid: f5330bc280c64b0ea32675f20abfd98a
      name: Network port discovery
      type: DEPENDENT
      key: intersight.port.discovery
      master_item:
        key: intersight.raw
      lifetime: 7d
      filter:
        evaltype: AND
        conditions:
        - macro: '{#PORT}'
          value: '{$INTERSIGHT.PORT.MATCHES}'
          formulaid: A
        - macro: '{#PORT}'
          value: '{$INTERSIGHT.PORT.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      lld_macro_paths:
      - lld_macro: '{#PORT}'
        path: $.name
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.ports
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      item_prototypes:
      - uuid: 2cf3e113b887404895fa985b34b28f34
        name: 'Port {#PORT}: received'
        type: DEPENDENT
        key: intersight.port.rx[{#PORT}]
        value_type: FLOAT
        master_item:
          key: intersight.raw
        units: Bps
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.ports[?(@.name=='{#PORT}')].rx_bps.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: network
        - tag: port
          value: '{#PORT}'
      - uuid: 74a16dd12c47443a857c99101fc9fb5a
        name: 'Port {#PORT}: transmitted'
        type: DEPENDENT
        key: intersight.port.tx[{#PORT}]
        value_type: FLOAT
        master_item:
          key: intersight.raw
        units: Bps
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.ports[?(@.name=='{#PORT}')].tx_bps.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: network
        - tag: port
          value: '{#PORT}'
      - uuid: 4eae5701913b48c195d4ecaefbea6af9
        name: 'Port {#PORT}: errors in window'
        type: DEPENDENT
        key: intersight.port.errors[{#PORT}]
        value_type: FLOAT
        master_item:
          key: intersight.raw
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.ports[?(@.name=='{#PORT}')].errors.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: network
        - tag: port
          value: '{#PORT}'
      - uuid: 6aaf6f8a65094b59be6472730ae82b90
        name: 'Port {#PORT}: bandwidth utilization'
        type: DEPENDENT
        key: intersight.port.util[{#PORT}]
        value_type: FLOAT
        master_item:
          key: intersight.raw
        units: '%'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.ports[?(@.name=='{#PORT}')].util.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: network
        - tag: port
          value: '{#PORT}'
      - uuid: 4fdf0a86463f40638591d7b435810086
        name: 'Port {#PORT}: link state'
        type: DEPENDENT
        key: intersight.port.up[{#PORT}]
        value_type: UNSIGNED
        master_item:
          key: intersight.raw
        valuemap:
          name: Link state
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.ports[?(@.name=='{#PORT}')].up.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: network
        - tag: port
          value: '{#PORT}'
      trigger_prototypes:
      - uuid: 68f2e95adee342b3a1912bde43849902
        expression: min(/Cisco Intersight FI by push/intersight.port.errors[{#PORT}],#3)>{$INTERSIGHT.PORT.ERRORS.WARN}
        name: 'Intersight: port {#PORT} has errors for 3 runs'
        priority: WARNING
        description: Sum of hw.errors_network_receive_all and hw.errors_network_transmit_all over the telemetry window.
      - uuid: ba9f456d1c364adc983938b7d4f8126d
        expression: min(/Cisco Intersight FI by push/intersight.port.util[{#PORT}],15m)>{$INTERSIGHT.PORT.UTIL.WARN}
        name: 'Intersight: port {#PORT} bandwidth above {$INTERSIGHT.PORT.UTIL.WARN}% for 15m'
        priority: WARNING
      - uuid: 8798e921d5254db98f83813e6449555e
        expression: last(/Cisco Intersight FI by push/intersight.port.up[{#PORT}])=0 and max(/Cisco Intersight FI by push/intersight.port.up[{#PORT}],24h)=1
        name: 'Intersight: port {#PORT} link down'
        priority: AVERAGE
        description: 'Fires only for links that were up during the last 24h, so unused ports stay silent. hw.network.up minimum over the window: a link down at least once reads as down.'
        manual_close: 'YES'
    tags:
    - tag: class
      value: hardware
    - tag: target
      value: cisco-intersight
    macros:
    - macro: '{$INTERSIGHT.NODATA}'
      value: 20m
      description: No pushed data for this long raises a warning.
    - macro: '{$INTERSIGHT.TEMP.MARGIN.WARN}'
      value: '10'
      description: Warn when a sensor is this close (°C) to its critical threshold.
    - macro: '{$INTERSIGHT.PORT.ERRORS.WARN}'
      value: '0'
      description: Port errors per telemetry window above this value raise a warning.
    - macro: '{$INTERSIGHT.PORT.UTIL.WARN}'
      value: '90'
      description: Port bandwidth utilization threshold (%).
    - macro: '{$INTERSIGHT.CPU.UTIL.WARN}'
      value: '90'
      description: CPU utilization threshold (%).
    - macro: '{$INTERSIGHT.MEM.UTIL.WARN}'
      value: '90'
      description: Memory utilization threshold (%), Fabric Interconnects.
    - macro: '{$INTERSIGHT.ECC.CORRECTABLE.WARN}'
      value: '0'
      description: Correctable ECC errors per window, sustained 3 runs.
    - macro: '{$INTERSIGHT.PSU.UTIL.WARN}'
      value: '80'
      description: PSU utilization threshold (%). Reported by Fabric Interconnects only.
    - macro: '{$INTERSIGHT.PORT.MATCHES}'
      value: .*
      description: Regex of ports to discover.
    - macro: '{$INTERSIGHT.PORT.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Regex of ports to ignore.
    valuemaps:
    - uuid: 8f1d1990301449e391fb98910e95daca
      name: Power state
      mappings:
      - value: '0'
        newvalue: 'Off'
      - value: '1'
        newvalue: 'On'
    - uuid: d567b014909947b9a1a8afdbfb93227a
      name: Link state
      mappings:
      - value: '0'
        newvalue: Down
      - value: '1'
        newvalue: Up
  - uuid: 04927e64081d4df6a386bc1390e7d65c
    template: Cisco Intersight by API
