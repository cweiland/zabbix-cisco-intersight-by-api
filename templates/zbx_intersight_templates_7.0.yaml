zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e885b88ecaf24a609f83378cf5b406e7
    name: Templates/Cisco Intersight
  host_groups:
  - uuid: 3551e392b7ef42ecb1bad66fd26abbff
    name: Intersight/Servers
  - uuid: d0a6a8717b7041ccbd5a0724741076e8
    name: Intersight/Chassis
  - uuid: 5718b96784474160b6185a5ad43ab06c
    name: Intersight/FI
  templates:
  - uuid: 02cec3ef1c0247a7a900bb2ab6556251
    template: Cisco Intersight Server by push
    name: Cisco Intersight Server by push
    description: 'Linked by host prototypes of "Cisco Intersight by API". Receives data via history.push; makes no API call itself. Class: rack and blade servers.'
    vendor:
      name: Custom
      version: 7.0-5
    groups:
    - name: Templates/Cisco Intersight
    items:
    - uuid: 21e93c5a89674d50948a85c794de6ae5
      name: Raw data (pushed by Intersight collector)
      type: TRAP
      key: intersight.raw
      history: 1h
      value_type: TEXT
      trends: '0'
      description: Filled by the parent host "Cisco Intersight by API" through the history.push API method. If Allowed hosts is set, it must include the Zabbix frontend IP.
      tags:
      - tag: component
        value: raw
      - tag: class
        value: server
      triggers:
      - uuid: b2dfda9c420e4cce811118eddcee1565
        expression: nodata(/Cisco Intersight Server by push/intersight.raw,{$INTERSIGHT.NODATA})=1
        name: 'Intersight: no data pushed for {$INTERSIGHT.NODATA}'
        priority: WARNING
        description: Check the parent collector item (API errors, push errors, API token).
    - uuid: 9c0effc72d344b6588dda6a79b510469
      name: 'Alarms: critical'
      type: DEPENDENT
      key: intersight.alarms.critical
      value_type: UNSIGNED
      master_item:
        key: intersight.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.alarm_critical
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: alarms
      - tag: class
        value: server
      triggers:
      - uuid: a8f2a072688445b1a2a4589704fc2666
        expression: last(/Cisco Intersight Server by push/intersight.alarms.critical)>0
        name: 'Intersight: {ITEM.LASTVALUE1} critical alarm(s)'
        priority: HIGH
    - uuid: 172a16f53bcd4099a5b94afbcf20847d
      name: 'Alarms: warning'
      type: DEPENDENT
      key: intersight.alarms.warning
      value_type: UNSIGNED
      master_item:
        key: intersight.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.alarm_warning
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: alarms
      - tag: class
        value: server
      triggers:
      - uuid: 4f836a2112a94421a30f847c689d72cd
        expression: last(/Cisco Intersight Server by push/intersight.alarms.warning)>0
        name: 'Intersight: {ITEM.LASTVALUE1} warning alarm(s)'
        priority: WARNING
    - uuid: 26b793047a7449b5b7891c8a9151c320
      name: Model
      type: DEPENDENT
      key: intersight.model
      value_type: CHAR
      master_item:
        key: intersight.raw
      history: 7d
      trends: '0'
      inventory_link: MODEL
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.model
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: inventory
      - tag: class
        value: server
    - uuid: 09ccc6ddc6a14f7d909056e1250eb278
      name: Serial number
      type: DEPENDENT
      key: intersight.serial
      value_type: CHAR
      master_item:
        key: intersight.raw
      history: 7d
      trends: '0'
      inventory_link: SERIALNO_A
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.serial
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: inventory
      - tag: class
        value: server
    - uuid: 8820b48154d541278c06c163dbfa3cac
      name: 'Power: average'
      type: DEPENDENT
      key: intersight.power
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: W
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.power_w
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: power
      - tag: class
        value: server
    - uuid: 89133279299a4c87a8aad0f597587b5d
      name: 'Power: peak'
      type: DEPENDENT
      key: intersight.power.max
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: W
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.power_max_w
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: power
      - tag: class
        value: server
    - uuid: 91d532ab428b4488986bd13fba5dd396
      name: 'Temperature: hottest sensor'
      type: DEPENDENT
      key: intersight.temp.max
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: °C
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.temp_max
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: thermal
      - tag: class
        value: server
    - uuid: 141c4dca70a849ccb7af5489046fdd81
      name: 'Temperature: smallest margin to critical'
      type: DEPENDENT
      key: intersight.temp.margin
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: °C
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.temp_margin_min
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: thermal
      - tag: class
        value: server
      triggers:
      - uuid: a34f90fb7da94a37ac8b4fcfc40c4735
        expression: max(/Cisco Intersight Server by push/intersight.temp.margin,15m)<{$INTERSIGHT.TEMP.MARGIN.WARN}
        name: 'Intersight: a sensor is within {$INTERSIGHT.TEMP.MARGIN.WARN}°C of its critical threshold'
        priority: HIGH
        description: Margin = hw.temperature.limit_high_critical - hw.temperature, per sensor. Each sensor is compared with its own threshold.
    - uuid: 9ef6e4ae7a894224bcdf226419356bf7
      name: 'Temperature: smallest margin to non-critical threshold'
      type: DEPENDENT
      key: intersight.temp.margin.degraded
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: °C
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.temp_margin_degraded_min
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: thermal
      - tag: class
        value: server
      triggers:
      - uuid: 14df77b796664762bb2f38042f2df0ce
        expression: max(/Cisco Intersight Server by push/intersight.temp.margin.degraded,15m)<0
        name: 'Intersight: a sensor is above its non-critical temperature threshold'
        priority: WARNING
        description: hw.temperature above hw.temperature.limit_high_degraded for 15m, on at least one sensor.
    - uuid: d2a779b847874f85b756c5b9e6e90299
      name: 'Fans: lowest speed'
      type: DEPENDENT
      key: intersight.fan.min
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: rpm
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.fan_min
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: fans
      - tag: class
        value: server
    - uuid: b048ad4579a64a32a8a4e886032af30c
      name: 'Fans: smallest margin to lower critical speed'
      type: DEPENDENT
      key: intersight.fan.margin
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: rpm
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.fan_margin_min
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: fans
      - tag: class
        value: server
      triggers:
      - uuid: 12ac256129cf4282bdc5edfa97346462
        expression: max(/Cisco Intersight Server by push/intersight.fan.margin,15m)<0
        name: 'Intersight: a fan is below its lower critical speed'
        priority: AVERAGE
        description: hw.fan.speed below hw.fan.speed.limit_low_critical for 15m, on at least one fan.
    - uuid: 2bf45221c3104748bdf1b8ce44d5cfdd
      name: 'Fans: highest speed'
      type: DEPENDENT
      key: intersight.fan.max
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: rpm
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.fan_max
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: fans
      - tag: class
        value: server
    - uuid: 9cc2e148c5584c628697dc92d61b343d
      name: 'PSU: highest utilization'
      type: DEPENDENT
      key: intersight.psu.util.max
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: '%'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.psu_util_max
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: psu
      - tag: class
        value: server
    - uuid: 5df84c16461d47bfa27e17cfcad81fd0
      name: 'Network: errors in window'
      type: DEPENDENT
      key: intersight.net.errors
      value_type: FLOAT
      master_item:
        key: intersight.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.net_errors
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: network
      - tag: class
        value: server
    - uuid: 6f7b695b36174ad2882fb841ad01915b
      name: 'Network: received'
      type: DEPENDENT
      key: intersight.net.rx
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: Bps
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.net_rx_bps
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: network
      - tag: class
        value: server
    - uuid: 330adfc9b609441f94126867284ea7b9
      name: 'Network: transmitted'
      type: DEPENDENT
      key: intersight.net.tx
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: Bps
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.net_tx_bps
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: network
      - tag: class
        value: server
    - uuid: 28d3c195db444aed9f6b779a55497923
      name: 'Energy: last 24h'
      type: CALCULATED
      key: intersight.energy.kwh.24h
      delay: 1h
      value_type: FLOAT
      params: avg(//intersight.power,24h)*24/1000
      units: kWh
      tags:
      - tag: component
        value: energy
      - tag: class
        value: server
    - uuid: d735186042e34f9f8a443249e7fec037
      name: 'Memory: correctable ECC errors in window'
      type: DEPENDENT
      key: intersight.mem.ecc.correctable
      value_type: FLOAT
      master_item:
        key: intersight.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.mem_ecc_correctable
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: memory
      - tag: class
        value: server
      triggers:
      - uuid: f72b9a7da49a4577baae8b454c4ad7e0
        expression: min(/Cisco Intersight Server by push/intersight.mem.ecc.correctable,#3)>{$INTERSIGHT.ECC.CORRECTABLE.WARN}
        name: 'Intersight: correctable ECC errors for 3 runs'
        priority: WARNING
        description: 'See item "Memory: DIMMs with ECC errors". Persistent correctable errors often precede a DIMM failure.'
    - uuid: 82520869680a45ea8aca66a507540e7b
      name: 'Memory: uncorrectable ECC errors in window'
      type: DEPENDENT
      key: intersight.mem.ecc.uncorrectable
      value_type: FLOAT
      master_item:
        key: intersight.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.mem_ecc_uncorrectable
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: memory
      - tag: class
        value: server
      triggers:
      - uuid: c652645a5bb44d1585f015a755ce5bc5
        expression: last(/Cisco Intersight Server by push/intersight.mem.ecc.uncorrectable)>0
        name: 'Intersight: {ITEM.LASTVALUE1} uncorrectable ECC error(s)'
        priority: HIGH
        description: 'See item "Memory: DIMMs with ECC errors".'
        manual_close: 'YES'
    - uuid: 271a62859a9740c5a35df62421f0cf8a
      name: 'Memory: DIMMs with ECC errors'
      type: DEPENDENT
      key: intersight.mem.ecc.dimms
      value_type: CHAR
      master_item:
        key: intersight.raw
      history: 30d
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.mem_ecc_dimms
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      tags:
      - tag: component
        value: memory
      - tag: class
        value: server
    - uuid: f09a4ba6007d414b91c5417d478bd70d
      name: 'CPU: utilization'
      type: DEPENDENT
      key: intersight.cpu.util
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: '%'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cpu_util
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: cpu
      - tag: class
        value: server
      triggers:
      - uuid: 36239e0d76374587962d14e7b7cc8db1
        expression: min(/Cisco Intersight Server by push/intersight.cpu.util,30m)>{$INTERSIGHT.CPU.UTIL.WARN}
        name: 'Intersight: CPU utilization above {$INTERSIGHT.CPU.UTIL.WARN}% for 30m'
        priority: WARNING
    - uuid: 1c8cb2cb324d406a8f446ab1c37b50be
      name: 'CPU: busiest processor (peak)'
      type: DEPENDENT
      key: intersight.cpu.util.max
      value_type: FLOAT
      master_item:
        key: intersight.raw
      units: '%'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cpu_util_max
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: cpu
      - tag: class
        value: server
    - uuid: 3c74a6a8a253435282fc91dc3e33187f
      name: Firmware (CIMC)
      type: DEPENDENT
      key: intersight.firmware
      value_type: CHAR
      master_item:
        key: intersight.raw
      history: 30d
      trends: '0'
      inventory_link: SOFTWARE
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.firmware
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: inventory
      - tag: class
        value: server
      triggers:
      - uuid: a86d9fb2efad49b6aa4000808fd9e6bd
        expression: change(/Cisco Intersight Server by push/intersight.firmware)=1
        name: 'Intersight: firmware changed to {ITEM.LASTVALUE1}'
        priority: INFO
        manual_close: 'YES'
    - uuid: 2c6e8c738bf5436abbbea4faf15f50c1
      name: Management IP
      type: DEPENDENT
      key: intersight.mgmt.ip
      value_type: CHAR
      master_item:
        key: intersight.raw
      history: 7d
      trends: '0'
      inventory_link: OOB_IP
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.mgmt_ip
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: inventory
      - tag: class
        value: server
    - uuid: 2bab154794ca431f80897f6c9c318629
      name: Power state
      type: DEPENDENT
      key: intersight.power.state
      value_type: UNSIGNED
      master_item:
        key: intersight.raw
      valuemap:
        name: Power state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.power_state
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: power
      - tag: class
        value: server
      triggers:
      - uuid: f5666ec3a8d24b53b8ae8658ca8e4663
        expression: last(/Cisco Intersight Server by push/intersight.power.state)=0
        name: 'Intersight: server is powered off'
        priority: AVERAGE
        description: Use a maintenance period for planned shutdowns.
        manual_close: 'YES'
    discovery_rules:
    - uuid: 6736e75cfb88446d87ba7ede30c4fdff
      name: PSU discovery
      type: DEPENDENT
      key: intersight.psu.discovery
      master_item:
        key: intersight.raw
      lifetime: 7d
      lld_macro_paths:
      - lld_macro: '{#PSU}'
        path: $.name
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.psus
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      item_prototypes:
      - uuid: 91272f7a25ee43da903e5e82ccba3e18
        name: 'PSU {#PSU}: utilization'
        type: DEPENDENT
        key: intersight.psu.util[{#PSU}]
        value_type: FLOAT
        master_item:
          key: intersight.raw
        units: '%'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.psus[?(@.name=='{#PSU}')].util.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: psu
        - tag: psu
          value: '{#PSU}'
      - uuid: 63938147441e4f169f6ed686d6ba6e81
        name: 'PSU {#PSU}: output power'
        type: DEPENDENT
        key: intersight.psu.out[{#PSU}]
        value_type: FLOAT
        master_item:
          key: intersight.raw
        units: W
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.psus[?(@.name=='{#PSU}')].out_w.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: psu
        - tag: psu
          value: '{#PSU}'
      trigger_prototypes:
      - uuid: 8ca0aaa800b14988a5ca1e0fe44e30f2
        expression: min(/Cisco Intersight Server by push/intersight.psu.util[{#PSU}],15m)>{$INTERSIGHT.PSU.UTIL.WARN}
        name: 'Intersight: PSU {#PSU} above {$INTERSIGHT.PSU.UTIL.WARN}% for 15m'
        priority: WARNING
        description: 'Little headroom left: losing the other PSU could overload this one.'
    - uuid: 584ca6a89ad647e5b8830d584a07e8d2
      name: Network port discovery
      type: DEPENDENT
      key: intersight.port.discovery
      master_item:
        key: intersight.raw
      lifetime: 7d
      filter:
        evaltype: AND
        conditions:
        - macro: '{#PORT}'
          value: '{$INTERSIGHT.PORT.MATCHES}'
          formulaid: A
        - macro: '{#PORT}'
          value: '{$INTERSIGHT.PORT.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      lld_macro_paths:
      - lld_macro: '{#PORT}'
        path: $.name
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.ports
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      item_prototypes:
      - uuid: d78de6a6b9de44b280951a5dae42e325
        name: 'Port {#PORT}: received'
        type: DEPENDENT
        key: intersight.port.rx[{#PORT}]
        value_type: FLOAT
        master_item:
          key: intersight.raw
        units: Bps
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.ports[?(@.name=='{#PORT}')].rx_bps.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: network
        - tag: port
          value: '{#PORT}'
      - uuid: 3a967a4d36a0482d879cfbd2859690cc
        name: 'Port {#PORT}: transmitted'
        type: DEPENDENT
        key: intersight.port.tx[{#PORT}]
        value_type: FLOAT
        master_item:
          key: intersight.raw
        units: Bps
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.ports[?(@.name=='{#PORT}')].tx_bps.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: network
        - tag: port
          value: '{#PORT}'
      - uuid: acedfed65605466b9a3bf2fc1b9093dd
        name: 'Port {#PORT}: errors in window'
        type: DEPENDENT
        key: intersight.port.errors[{#PORT}]
        value_type: FLOAT
        master_item:
          key: intersight.raw
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.ports[?(@.name=='{#PORT}')].errors.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: network
        - tag: port
          value: '{#PORT}'
      - uuid: 7b58a45289fa4768a82d2b7d0ff6090d
        name: 'Port {#PORT}: bandwidth utilization'
        type: DEPENDENT
        key: intersight.port.util[{#PORT}]
        value_type: FLOAT
        master_item:
          key: intersight.raw
        units: '%'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.ports[?(@.name=='{#PORT}')].util.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: network
        - tag: port
          value: '{#PORT}'
      - uuid: 2c40c7f5feba492388a7d1e9c372eb21
        name: 'Port {#PORT}: link state'
        type: DEPENDENT
        key: intersight.port.up[{#PORT}]
        value_type: UNSIGNED
        master_item:
          key: intersight.raw
        valuemap:
          name: Link state
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.ports[?(@.name=='{#PORT}')].up.first()
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: network
        - tag: port
          value: '{#PORT}'
      trigger_prototypes:
      - uuid: b71c852e58944cdaaf616978493e2588
        expression: min(/Cisco Intersight Server by push/intersight.port.errors[{#PORT}],#3)>{$INTERSIGHT.PORT.ERRORS.WARN}
        name: 'Intersight: port {#PORT} has errors for 3 runs'
        priority: WARNING
        description: Sum of hw.errors_network_receive_all and hw.errors_network_transmit_all over the telemetry window.
      - uuid: 76a8c16ef0254bbf8be87b8e6bbb8e00
        expression: min(/Cisco Intersight Server by push/intersight.port.util[{#PORT}],15m)>{$INTERSIGHT.PORT.UTIL.WARN}
        name: 'Intersight: port {#PORT} bandwidth above {$INTERSIGHT.PORT.UTIL.WARN}% for 15m'
        priority: WARNING
      - uuid: 4cd8cc68e57c411ab4fb280e0c3c343b
        expression: last(/Cisco Intersight Server by push/intersight.port.up[{#PORT}])=0 and max(/Cisco Intersight Server by push/intersight.port.up[{#PORT}],24h)=1
        name: 'Intersight: port {#PORT} link down'
