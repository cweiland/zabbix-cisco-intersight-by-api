    - uuid: af2fb7791674486489fc011a4999f733
      name: Models discovery (aggregates per type)
      type: DEPENDENT
      key: intersight.models.discovery
      master_item:
        key: intersight.collect
      lifetime: 7d
      lld_macro_paths:
      - lld_macro: '{#CLASS}'
        path: $.class
      - lld_macro: '{#MODEL}'
        path: $.model
      - lld_macro: '{#GROUP}'
        path: $.group
      preprocessing:
      - type: JSONPATH
        parameters:
