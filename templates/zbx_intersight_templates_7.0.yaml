      - uuid: f9db122c1c714f4eb099aabb8a04d01b
        name: '{#CLASS} {#MODEL}: hottest sensor'
        type: CALCULATED
        key: intersight.model.temp.max[{#CLASS},{#MODEL}]
        delay: 5m
