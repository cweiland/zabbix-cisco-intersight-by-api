    discovery_rules:
    - uuid: a13e9a2dacdc45b59dc100a39ce6bb44
      name: Servers discovery
      type: DEPENDENT
      key: intersight.servers.discovery
      master_item:
        key: intersight.collect
      lifetime: 7d
      lld_macro_paths:
      - lld_macro: '{#MOID}'
        path: $.moid
      - lld_macro: '{#NAME}'
        path: $.display
      - lld_macro: '{#MODEL}'
        path: $.model
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.servers
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      host_prototypes:
      - uuid: fec67a0802624bb49fe2f1d3e17b0f8c
        host: intersight-{#MOID}
        name: '{#NAME}'
        inventory_mode: AUTOMATIC
        group_links:
        - group:
            name: Intersight/Servers
        group_prototypes:
        - name: Intersight/Servers/{#MODEL}
        templates:
        - name: Cisco Intersight Server by push
        tags:
        - tag: intersight.class
          value: server
        - tag: intersight.model
          value: '{#MODEL}'
    - uuid: 32a48785c23d439ba40838f80d58fd1e
