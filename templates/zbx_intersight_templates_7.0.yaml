      - uuid: 9190018d66074570afd42e0137ed4915
        name: '{#CLASS} {#MODEL}: devices reporting'
        type: CALCULATED
        key: intersight.model.count[{#CLASS},{#MODEL}]
        delay: 5m
        value_type: FLOAT
        params: count(last_foreach(/*/intersight.power?[group="{#GROUP}"]))
        tags:
        - tag: component
