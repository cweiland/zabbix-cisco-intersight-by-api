name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collector tests (ECDSA, auth modes, scenarios)
        run: node tests/run_all.js

      - name: ES5 only (Zabbix embeds Duktape)
        run: |
          if grep -nE '\blet |\bconst |=>|`' src/collector.js; then
            echo "ES2015+ syntax found in src/collector.js"; exit 1
          fi

      - name: Template is up to date with src/collector.js
        run: |
          pip install pyyaml==6.0.3
          python3 tools/generate_templates.py
          git diff --exit-code templates/

      - name: Template structure (macros, UUIDs, keys, triggers, value maps)
        run: python3 tools/validate_template.py
